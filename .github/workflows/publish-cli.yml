# Step 3b — npm publish pipeline
#
# Triggered by version tags (v*.*.*).
# Publishes the `killswitch` npm package with provenance attestations.
#
# Required repository secrets:
#   NPM_TOKEN — npm automation token with publish access to `killswitch`

name: Publish CLI to npm

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read
  id-token: write   # required for npm provenance attestation

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Verify package.json version matches tag
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          PKG_VERSION="v$(node -p "require('./packages/cli/package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: tag $TAG_VERSION does not match CLI package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Publish to npm (with provenance)
        run: pnpm --filter cli publish --provenance --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
