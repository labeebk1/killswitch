# Docker image build + publish to GHCR on version tags.
#
# Builds a multi-platform image (linux/amd64, linux/arm64),
# signs it with cosign (keyless OIDC), and publishes to
# ghcr.io/labeebk1/killswitch-cli.
#
# The pinned digest is written to docker/PINNED_IMAGE so the CLI
# can read it at build time to hard-code the re-exec target.

name: Publish CLI Docker image

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write       # update PINNED_IMAGE file
  packages: write       # push to GHCR
  id-token: write       # cosign keyless signing

jobs:
  build-and-push:
    name: Build + push + sign
    runs-on: ubuntu-latest

    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/labeebk1/killswitch-cli
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless OIDC)
        run: |
          cosign sign --yes \
            ghcr.io/labeebk1/killswitch-cli@${{ steps.push.outputs.digest }}

      - name: Write pinned digest
        run: |
          echo "ghcr.io/labeebk1/killswitch-cli@${{ steps.push.outputs.digest }}" \
            > docker/PINNED_IMAGE
          cat docker/PINNED_IMAGE

      - name: Commit updated PINNED_IMAGE
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(docker): pin image digest ${{ github.ref_name }}"
          file_pattern: docker/PINNED_IMAGE
          branch: main
